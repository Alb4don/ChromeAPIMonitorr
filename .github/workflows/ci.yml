name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check (standalone)
        run: node --check server-standalone.js

      - name: Syntax check (Express)
        run: node --check server.js

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Start standalone server briefly
        run: |
          node server-standalone.js &
          SERVER_PID=$!
          sleep 8
          curl -sf http://localhost:3000/health | grep -q healthy
          curl -sf http://localhost:3000/api/status | grep -q '"success":true'
          kill $SERVER_PID || true

  docker:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chrome-api-monitor:ci .

      - name: Run container health check
        run: |
          docker run -d --name cam -p 3000:3000 chrome-api-monitor:ci
          sleep 12
          curl -sf http://localhost:3000/health | grep -q healthy
          docker stop cam
          docker rm cam
